apiVersion: apps/v1
kind: Deployment
metadata:
  name: odosian
  namespace: odosian
  labels:
    app: odosian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odosian
  template:
    metadata:
      labels:
        app: odosian
    spec:
      containers:
        - name: odosian
          image: odosian:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: odosian-secret
            - configMapRef:
                name: odosian-config
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: odosian-data
